name: Build and push image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mardi4nfdi/logstash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is tagged with the Logstash version it is built on.
      - name: Logstash version
        id: version
        run: echo "logstash=$(sed -n 's|^FROM .*/logstash-oss:||p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.version.outputs.logstash }},enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Pull requests only build, to check the Dockerfile.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Like docker-wikibase: each image from main becomes a portal-k8s
      # pull request that deploys it. The digest makes a rebuild with
      # the same Logstash, e.g. for a new plugin, a change too.
      - name: Generate portal-k8s GitHub App token
        if: github.ref == 'refs/heads/main'
        id: portal-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PORTAL_K8S_APP_ID }}
          private-key: ${{ secrets.PORTAL_K8S_APP_PRIVATE_KEY }}
          owner: MaRDI4NFDI
          repositories: portal-k8s

      - name: Checkout portal-k8s
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          repository: MaRDI4NFDI/portal-k8s
          token: ${{ steps.portal-app-token.outputs.token }}
          path: portal-k8s

      - name: Update production values
        if: github.ref == 'refs/heads/main'
        working-directory: portal-k8s
        run: |
          yq -i \
            '.spec.values.logstash.image.tag = "${{ steps.version.outputs.logstash }}@${{ steps.build.outputs.digest }}"' \
            apps/production/logstash/values-production.yaml

      - name: Create production PR
        if: github.ref == 'refs/heads/main'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.portal-app-token.outputs.token }}
          path: portal-k8s
          branch: update/logstash
          delete-branch: true
          sign-commits: true
          title: "Update Logstash image to ${{ steps.version.outputs.logstash }}"
          commit-message: "Update Logstash image to ${{ steps.version.outputs.logstash }}"
          body: |
            @coderabbitai ignore

            This PR is automatically generated by the [docker-logstash workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - Source commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Image: `${{ env.IMAGE }}:${{ steps.version.outputs.logstash }}@${{ steps.build.outputs.digest }}`

      - name: Add portal-k8s PR link to summary
        if: steps.cpr.outputs.pull-request-url != ''
        run: |
          echo "Production PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
