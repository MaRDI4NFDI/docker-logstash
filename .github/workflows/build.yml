name: Build and push image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mardi4nfdi/logstash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Pull requests only build, to check the Dockerfile.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Like docker-wikibase's production release: each release tag
      # vX.Y.Z becomes a portal-k8s pull request that deploys X.Y.Z.
      - name: Release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate portal-k8s GitHub App token
        if: startsWith(github.ref, 'refs/tags/v')
        id: portal-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PORTAL_K8S_APP_ID }}
          private-key: ${{ secrets.PORTAL_K8S_APP_PRIVATE_KEY }}
          owner: MaRDI4NFDI
          repositories: portal-k8s

      - name: Checkout portal-k8s
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v7
        with:
          repository: MaRDI4NFDI/portal-k8s
          token: ${{ steps.portal-app-token.outputs.token }}
          path: portal-k8s

      - name: Update production values
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: portal-k8s
        run: |
          yq -i \
            '.spec.values.image.tag = "${{ steps.version.outputs.release }}@${{ steps.build.outputs.digest }}"' \
            apps/production/logstash/values-production.yaml

      - name: Create production PR
        if: startsWith(github.ref, 'refs/tags/v')
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.portal-app-token.outputs.token }}
          path: portal-k8s
          branch: update/logstash
          delete-branch: true
          sign-commits: true
          title: "Update Logstash image to ${{ steps.version.outputs.release }}"
          commit-message: "Update Logstash image to ${{ steps.version.outputs.release }}"
          body: |
            @coderabbitai ignore

            This PR is automatically generated by the [docker-logstash workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - Release: [`${{ github.ref_name }}`](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})
            - Source commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Image: `${{ env.IMAGE }}:${{ steps.version.outputs.release }}@${{ steps.build.outputs.digest }}`

      - name: Add portal-k8s PR link to summary
        if: steps.cpr.outputs.pull-request-url != ''
        run: |
          echo "Production PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
