# MediaWiki sends one Logstash JSON record per UDP datagram.
input {
  udp {
    port => 11514
    codec => json
    # Keep the record's own "host" (the pod name) intact.
    source_ip_fieldname => "source_ip"
    # Ask for exactly net.core.rmem_max of the cluster nodes, which a
    # pod cannot raise. The kernel doubles it to 416 KiB; without a
    # request the socket gets only rmem_default (208 KiB).
    receive_buffer_bytes => "${UDP_RECEIVE_BUFFER_BYTES:212992}"
    # Bursts beyond that wait in Logstash's own queue (default 2000).
    queue_size => "${UDP_QUEUE_SIZE:20000}"
  }
}
